[project]
name = "Subway"
version = "0.1.0"

[serve]
base_route_app = "app"
port = 8000

[dependencies.npm]
"react-router-dom" = "latest"
"react-error-boundary" = "latest"
"react-hook-form" = "latest"
"@hookform/resolvers" = "latest"
zod = "latest"
react = "latest"
"react-dom" = "latest"
"@hugeicons/react" = "latest"
"@hugeicons/core-free-icons" = "latest"
"class-variance-authority" = "latest"
"radix-ui" = "latest"
clsx = "latest"
"tailwind-merge" = "latest"
"tw-animate-css" = "latest"
"@fontsource-variable/inter" = "latest"

[dependencies.npm.dev]
tailwindcss = "latest"
"@tailwindcss/vite" = "latest"
"@vitejs/plugin-react" = "^4.3.4"

[jac-shadcn]
style = "nova"
baseColor = "zinc"
theme = "indigo"
font = "inter"
radius = "medium"
menuAccent = "subtle"
menuColor = "default"

[jacpack]
name = 'Subway'
description = 'Jac IDE snapshot for Subway'

[byllm.model]
default_model = "gpt-4o-mini"
